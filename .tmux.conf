set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g xterm-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

set -ga terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'

set -g status-bg '#15181D'
set -g status-fg '#DCE2EA'
set -g status-left '#[fg=#83B9FF] #S #[default]'
set -g status-left-length 160
set -g status-right-length 160
set -g status-right " #T "
set -g set-titles on
set -g set-titles-string '#T'

set -g window-status-current-style 'bg=#252A33,fg=#83B9FF,bold'
set -g window-status-style 'fg=#ADB7C4'

set -g pane-border-style 'fg=#526071'
set -g pane-active-border-style 'fg=#83B9FF'

set -g message-style 'bg=#D7BA7D,fg=#1B1E24,bold'
set -g message-command-style 'bg=#D7BA7D,fg=#1B1E24'
set -g mode-style 'bg=#304F6B,fg=#F4F8FC'
set -g copy-mode-selection-style 'bg=#304F6B'
set -g copy-mode-current-line-style 'bg=#FF10F0,fg=#1B1E24'

set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g focus-events on

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

run '~/.tmux/plugins/tpm/tpm'
